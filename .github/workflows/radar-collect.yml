name: RADAR DA - collecte RSS et audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/collect_radar.py'
      - '.github/workflows/radar-collect.yml'
  schedule:
    # UTC; 6/12/16/20 Paris en hiver, 7/13/17/21 en été
    - cron: '0 5,11,15,19 * * *'
permissions:
  contents: write
concurrency:
  group: radar-da-rss
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collecter et journaliser les erreurs
        run: python scripts/collect_radar.py
      - name: Afficher le bilan de collecte
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/collection_report.json").read_text())
          print("Sources directes tentées:", d.get("direct_sources_attempted"))
          print("Sources avec articles ouverts:", d.get("direct_sources_with_articles_opened"))
          print("Articles réellement ouverts:", d.get("direct_articles_opened"))
          print("Sources incomplètes:", d.get("direct_sources_incomplete"))
          print("Flux RSS tentés:", d["rss_sources_attempted"])
          print("Flux RSS analysés:", d["rss_sources_parsed"])
          print("Échecs:", d["rss_sources_failed"])
          print("Candidats 24 h:", d["candidates_24h"])
          print("Candidats 72 h:", d["candidates_72h"])
          PY
      - name: Sauvegarder le rapport sans publier de fiche non vérifiée
        run: |
          git config user.name "radar-da-bot"
          git config user.email "radar-da-bot@users.noreply.github.com"
          git add data/collection_report.json
          if ! git diff --cached --quiet; then
            git commit -m "RADAR DA: refresh RSS candidate audit"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
