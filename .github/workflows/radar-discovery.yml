name: RADAR DA - collecte des sources (sans publication)
on:
  schedule:
    - cron: '5 5,11,15,19 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: radar-da-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan catalog and record new links
        run: python scripts/radar_collect.py
      - name: Commit discovery-only outputs
        run: |
          git config user.name "radar-da-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/collector/latest_report.json data/collector/latest_candidates.json data/collector/seen_urls.json
          if ! git diff --cached --quiet; then
            git commit -m "RADAR DA: record source scan and new candidate links"
            git push
          fi
