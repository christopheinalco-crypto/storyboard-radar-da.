name: Actualiser la veille
on:
  workflow_dispatch:
  push:
    paths:
      - 'collect.py'
      - 'data/sources.json'
      - '.github/workflows/veille.yml'
  schedule:
    - cron: '20 7 * * *'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python collect.py
      - name: Publier les nouvelles données
        run: |
          git config user.name 'radar-da-bot'
          git config user.email 'radar-da-bot@users.noreply.github.com'
          git add data/feed.json
          git diff --cached --quiet || (git commit -m 'Actualisation du radar' && git push)
