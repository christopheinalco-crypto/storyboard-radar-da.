name: Actualiser la veille
on:
  workflow_dispatch:
    inputs:
      special:
        description: "Veille spéciale : 3 projets maximum par catégorie, priorité spectacles concerts clips"
        type: boolean
        default: true
        required: false
  push:
    paths:
      - 'collect.py'
      - 'data/sources.json'
      - '.github/workflows/veille.yml'
  schedule:
    # Six créneaux de Paris (6,9,12,15,18,21), hiver/été.
    - cron: '37 4,5,7,8,10,11,13,14,16,17,19,20 * * *'
concurrency:
  group: radar-da-collect-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier le créneau prévu (indépendant du retard GitHub)
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import datetime,os
          from zoneinfo import ZoneInfo
          event=os.environ['EVENT_NAME']
          cron=os.environ.get('SCHEDULE_CRON','')
          now=datetime.datetime.now(datetime.timezone.utc)
          slot=0
          run=True
          if event=='schedule':
              # L'heure vient du cron prévu, pas de l'heure de démarrage réelle.
              hour=int(cron.split()[1])
              local_date=now.astimezone(ZoneInfo('Europe/Paris')).date()
              # Convertir le créneau UTC planifié en heure de Paris.
              planned_utc=datetime.datetime.combine(local_date,datetime.time(hour,37),datetime.timezone.utc)
              local=planned_utc.astimezone(ZoneInfo('Europe/Paris'))
              hours=(6,9,12,15,18,21)
              run=local.hour in hours and local.minute==37
              if run:slot=hours.index(local.hour)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"run={'true' if run else 'false'}\n")
              f.write(f"slot={slot}\n")
          print('event:',event,'planned cron:',cron,'run:',run,'slot:',slot)
          PY
      - name: Collecter le créneau éditorial
        if: steps.slot.outputs.run == 'true'
        env:
          RADAR_SLOT: ${{ github.event.schedule || 'manual' }}
          RADAR_SLOT_INDEX: ${{ steps.slot.outputs.slot }}
          RADAR_SPECIAL: ${{ (github.event_name == 'workflow_dispatch' && inputs.special) && '1' || '0' }}
        run: python collect.py
      - name: Analyser les projets sélectionnés
        if: steps.slot.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RADAR_AI_MODEL: gpt-4.1-mini
        run: python analyze.py
      - name: Résumé du contrôle éditorial
        if: always() && steps.slot.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json, pathlib, os
          p=pathlib.Path('data/analyses.json')
          a=json.loads(p.read_text()) if p.exists() else {}
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## RADAR — Analyse critique automatique\\n\\n')
              f.write(f'Analyses IA enregistrées : **{len(a)}**\\n\\n')
              f.write('Une exécution réussie de collecte ne garantit pas une nouvelle analyse.\\n')
          PY
      - name: Publier les nouvelles données
        if: steps.slot.outputs.run == 'true'
        run: |
          git config user.name 'radar-da-bot'
          git config user.email 'radar-da-bot@users.noreply.github.com'
          git add data/feed.json data/analyses.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualisation du radar'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase -X ours origin/main; then
                git rebase --abort || true
                echo 'Conflit de données : nouvelle collecte nécessaire, sans écraser la branche.'
                exit 1
              fi
              if git push origin HEAD:main; then
                echo 'Veille publiée avec succès.'
                exit 0
              fi
              sleep $((attempt * 2))
            done
            echo 'Échec de publication après 5 tentatives.'
            exit 1
          fi
