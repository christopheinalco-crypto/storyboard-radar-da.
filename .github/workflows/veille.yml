name: Actualiser la veille
on:
  workflow_dispatch:
    inputs:
      special:
        description: "Veille spéciale : 3 projets maximum par catégorie, priorité spectacles concerts clips"
        type: boolean
        default: true
        required: false
  push:
    paths:
      - 'collect.py'
      - 'data/sources.json'
      - '.github/workflows/veille.yml'
  schedule:
    # UTC : deux séries pour couvrir heures d'été et d'hiver.
    # Minutes 37 : hors de la pointe des workflows planifiés.
    - cron: '37 4 * * *'
    - cron: '37 6 * * *'
    - cron: '37 8 * * *'
    - cron: '37 10 * * *'
    - cron: '37 12 * * *'
    - cron: '37 14 * * *'
    - cron: '37 16 * * *'
    - cron: '37 18 * * *'
    - cron: '37 5 * * *'
    - cron: '37 7 * * *'
    - cron: '37 9 * * *'
    - cron: '37 11 * * *'
    - cron: '37 13 * * *'
    - cron: '37 15 * * *'
    - cron: '37 17 * * *'
    - cron: '37 19 * * *'
concurrency:
  group: radar-da-collect-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier le créneau prévu (indépendant du retard GitHub)
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import datetime,os
          from zoneinfo import ZoneInfo
          event=os.environ['EVENT_NAME']
          cron=os.environ.get('SCHEDULE_CRON','')
          now=datetime.datetime.now(datetime.timezone.utc)
          slot=0
          run=True
          if event=='schedule':
              # L'heure vient du cron prévu, pas de l'heure de démarrage réelle.
              hour=int(cron.split()[1])
              local_date=now.astimezone(ZoneInfo('Europe/Paris')).date()
              # Convertir le créneau UTC planifié en heure de Paris.
              planned_utc=datetime.datetime.combine(local_date,datetime.time(hour,37),datetime.timezone.utc)
              local=planned_utc.astimezone(ZoneInfo('Europe/Paris'))
              hours=(6,8,10,12,14,16,18,20)
              run=local.hour in hours and local.minute==37
              if run:slot=hours.index(local.hour)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"run={'true' if run else 'false'}\n")
              f.write(f"slot={slot}\n")
          print('event:',event,'planned cron:',cron,'run:',run,'slot:',slot)
          PY
      - name: Collecter le créneau éditorial
        if: steps.slot.outputs.run == 'true'
        env:
          RADAR_SLOT: ${{ github.event.schedule || 'manual' }}
          RADAR_SLOT_INDEX: ${{ steps.slot.outputs.slot }}
          RADAR_SPECIAL: ${{ (github.event_name == 'workflow_dispatch' && inputs.special) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[special-veille]')) && '1' || '0' }}
        run: python collect.py
      - name: Publier les nouvelles données
        if: steps.slot.outputs.run == 'true'
        run: |
          git config user.name 'radar-da-bot'
          git config user.email 'radar-da-bot@users.noreply.github.com'
          git add data/feed.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualisation du radar'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase -X ours origin/main; then
                git rebase --abort || true
                echo 'Conflit de données : nouvelle collecte nécessaire, sans écraser la branche.'
                exit 1
              fi
              if git push origin HEAD:main; then
                echo 'Veille publiée avec succès.'
                exit 0
              fi
              sleep $((attempt * 2))
            done
            echo 'Échec de publication après 5 tentatives.'
            exit 1
          fi
