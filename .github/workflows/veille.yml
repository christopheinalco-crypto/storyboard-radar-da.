name: Actualiser la veille
on:
  workflow_dispatch:
    inputs:
      special:
        description: "Veille spéciale : 3 projets maximum par catégorie, priorité spectacles concerts clips"
        type: boolean
        default: true
        required: false
  push:
    paths:
      - 'collect.py'
      - 'data/sources.json'
      - '.github/workflows/veille.yml'
  schedule:
    # Trois passages par jour, 06:00, 12:00 et 16:00 à Paris (DST géré par le contrôle local).
    - cron: '0 4,5,10,11,14,15 * * *'
concurrency:
  group: radar-da-collect-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier le créneau prévu (indépendant du retard GitHub)
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import datetime,os
          from zoneinfo import ZoneInfo
          event=os.environ['EVENT_NAME']
          cron=os.environ.get('SCHEDULE_CRON','')
          now=datetime.datetime.now(datetime.timezone.utc)
          slot=0
          run=True
          if event=='schedule':
              # Le cron contient une liste d'heures UTC : ne pas convertir la liste en int.
              # Les exécutions GitHub peuvent démarrer avec quelques minutes de retard.
              local=now.astimezone(ZoneInfo('Europe/Paris'))
              hours=(6,12,16)
              run=local.hour in hours
              if run:slot=hours.index(local.hour)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"run={'true' if run else 'false'}\n")
              f.write(f"slot={slot}\n")
          print('event:',event,'planned cron:',cron,'run:',run,'slot:',slot)
          PY
      - name: Collecter le créneau éditorial
        if: steps.slot.outputs.run == 'true'
        env:
          RADAR_SLOT: ${{ github.event.schedule || 'manual' }}
          RADAR_SLOT_INDEX: ${{ steps.slot.outputs.slot }}
          RADAR_SPECIAL: ${{ (github.event_name == 'workflow_dispatch' && inputs.special) && '1' || '0' }}
        run: python collect.py
      - name: Tester les critères de sélection avant Gemini
        if: steps.slot.outputs.run == 'true'
        run: python test_editorial.py
      - name: Analyser et valider les projets avec Gemini
        if: steps.slot.outputs.run == 'true'
        id: editorial
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RADAR_AI_MODEL: gemini-3.5-flash-lite
        run: python analyze.py
      - name: Publier les nouvelles données
        if: steps.slot.outputs.run == 'true'
        run: |
          git config user.name 'radar-da-bot'
          git config user.email 'radar-da-bot@users.noreply.github.com'
          git add data/feed.json data/analyses.json data/reviewed.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualisation du radar'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase -X ours origin/main; then
                git rebase --abort || true
                echo 'Conflit de données : nouvelle collecte nécessaire, sans écraser la branche.'
                exit 1
              fi
              if git push origin HEAD:main; then
                echo 'Veille publiée avec succès.'
                exit 0
              fi
              sleep $((attempt * 2))
            done
            echo 'Échec de publication après 5 tentatives.'
            exit 1
          fi

      - name: Signaler clairement un échec de l'analyse
        if: always() && steps.slot.outputs.run == 'true' && steps.editorial.outcome == 'failure'
        run: |
          echo "::error::Analyse automatique en échec. Vérifier GEMINI_API_KEY, quota Gemini et journaux de analyze.py. La collecte peut avoir été publiée, mais pas les décryptages."
          exit 1
