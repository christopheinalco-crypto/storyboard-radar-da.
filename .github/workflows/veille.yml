name: Actualiser la veille
on:
  workflow_dispatch:
  push:
    paths:
      - 'collect.py'
      - 'data/sources.json'
      - '.github/workflows/veille.yml'
  schedule:
    # Deux séries UTC : le contrôle Europe/Paris ignore celle hors saison.
    - cron: '30 4,6,8,10,12,14,16,18 * * *'
    - cron: '30 5,7,9,11,13,15,17,19 * * *'
    - cron: '9 13 * * *' # Test unique du 7 novembre 2026 à 14h09 Paris
concurrency:
  group: radar-da-collect-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier le créneau de Paris (heure été/hiver)
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import datetime,os
          from zoneinfo import ZoneInfo
          local=datetime.datetime.now(ZoneInfo('Europe/Paris'))
          allowed=(6,8,10,12,14,16,18,20)
          special=os.environ.get('SCHEDULE_CRON')=='9 13 * * *'
          run=(local.date().isoformat()=='2026-11-07' and special) or (not special and (os.environ['EVENT_NAME']!='schedule' or local.hour in allowed))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"run={'true' if run else 'false'}\n")
          print('Paris:',local.isoformat(),'collect:',run)
          PY
      - name: Collecter le créneau éditorial
        if: steps.slot.outputs.run == 'true'
        env:
          RADAR_SLOT: ${{ github.event.schedule || 'manual' }}
          RADAR_SPECIAL: ${{ github.event.schedule == '9 13 * * *' && '1' || '0' }}
        run: python collect.py
      - name: Publier les nouvelles données
        if: steps.slot.outputs.run == 'true'
        run: |
          git config user.name 'radar-da-bot'
          git config user.email 'radar-da-bot@users.noreply.github.com'
          git add data/feed.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualisation du radar'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase -X ours origin/main; then
                git rebase --abort || true
                echo 'Conflit de données : nouvelle collecte nécessaire, sans écraser la branche.'
                exit 1
              fi
              if git push origin HEAD:main; then
                echo 'Veille publiée avec succès.'
                exit 0
              fi
              sleep $((attempt * 2))
            done
            echo 'Échec de publication après 5 tentatives.'
            exit 1
          fi
