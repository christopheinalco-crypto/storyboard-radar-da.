name: RADAR DA — collecte des sources
on:
  workflow_dispatch:
  schedule:
    - cron: '15 4,10,14,18 * * *'
permissions:
  contents: write
concurrency:
  group: radar-source-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collecter et tracer les sources
        run: |
          python scripts/collect_sources.py
          python scripts/radar_pipeline.py
      - name: Enregistrer audit et découvertes sans toucher au flux public
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-coverage.json data/source-discoveries.json data/editorial-shortlist.json
          if ! git diff --cached --quiet; then
            git commit -m "RADAR DA: audit automatique des sources et découvertes"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
