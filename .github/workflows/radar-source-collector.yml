name: RADAR DA — collecte des sources
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/collect_sources.py'
      - 'scripts/radar_pipeline.py'
      - 'scripts/inspect_projects.py'
      - 'scripts/build_editorial_brief.py'
      - '.github/workflows/radar-source-collector.yml'
  schedule:
    # Préparer la collecte AVANT les veilles ChatGPT à 6 h, 12 h, 16 h et 20 h.
    - cron: '5 5,11,15,19 * * *'
      timezone: Europe/Paris
permissions:
  contents: write
  actions: read
concurrency:
  group: radar-source-collector-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier la syntaxe des scripts
        run: python -m py_compile scripts/collect_sources.py scripts/radar_pipeline.py scripts/inspect_projects.py scripts/build_editorial_brief.py
      - name: Isoler les rapports de cette exécution
        run: rm data/{source-discoveries,editorial-shortlist,project-inspections}.json
      - name: Identifier la vague
        run: echo "RADAR_WAVE_ID=github-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
      - name: Reprendre les sources déjà contrôlées
        if: github.run_attempt > 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$((GITHUB_RUN_ATTEMPT - 1))
          while [ "$previous" -gt 0 ]; do
            if gh run download "$GITHUB_RUN_ID" --name "radar-reprise-$GITHUB_RUN_ID-$previous" --dir data; then break; fi
            previous=$((previous - 1))
          done
      - name: Collecter et tracer les sources
        id: collect
        run: python scripts/collect_sources.py
      - name: Présélectionner les liens
        run: python scripts/radar_pipeline.py
      - name: Examiner les pages projets
        run: python scripts/inspect_projects.py
      - name: Préparer une boîte de réception éditoriale concise (sans sélectionner ni publier)
        run: python scripts/build_editorial_brief.py
      - name: Sauvegarder le point de reprise
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-reprise-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/source-checkpoint.json
          if-no-files-found: ignore
      - name: Archiver les preuves de cette exécution
        if: always() && steps.collect.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: radar-collecte-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            data/source-coverage.json
            data/source-discoveries.json
            data/editorial-shortlist.json
            data/project-inspections.json
            data/editorial-brief.json
      - name: Enregistrer audit et découvertes sans toucher au flux public
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-coverage.json data/source-discoveries.json data/editorial-shortlist.json data/project-inspections.json data/editorial-brief.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "RADAR DA: audit automatique des sources et découvertes"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:refs/heads/main; then exit 0; fi
          done
          exit 1
