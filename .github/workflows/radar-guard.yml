name: RADAR DA - garde-fou publication
on:
  workflow_dispatch:
  schedule:
    - cron: '55 5,11,15,19 * * *'
      timezone: Europe/Paris
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify RADAR interface and editorial data
        run: node scripts/validate-radar.mjs
      - name: Vérifier la fraîcheur des rapports avant la veille
        run: node scripts/check-collection-freshness.cjs
